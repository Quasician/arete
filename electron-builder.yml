appId: com.quasician.arete
productName: Arete
copyright: Copyright © 2026 Quasician
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - '!**/*.map'
win:
  target: nsis
  icon: build/icon.ico
  artifactName: Arete-Setup-${version}.${ext}
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: Arete
  # Keep data (database, settings, keys) when uninstalling or updating.
  deleteAppDataOnUninstall: false
publish:
  provider: github
  owner: Quasician
  repo: arete
  # Uploads go into a draft that the Release workflow creates first and
  # publishes once every file is up. Letting electron-builder create the
  # release itself races and can make two releases for one version.
  releaseType: draft
