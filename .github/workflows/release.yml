name: Release

# Bump "version" in package.json and push to main: this workflow tags that
# version, builds the Windows installer and publishes it as a GitHub release.
# Installed copies of Arete find the release and update themselves.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version and whether it is already released
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Released means the release exists AND has the update manifest, so an
          # interrupted upload gets finished on the next run instead of skipped.
          if gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx latest.yml; then
            echo "$tag is already released; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.version.outputs.skip == 'false'
        with:
          node-version: 22
          cache: npm

      - if: steps.version.outputs.skip == 'false'
        run: npm ci

      - if: steps.version.outputs.skip == 'false'
        run: npm test

      - name: Tag the release
        if: steps.version.outputs.skip == 'false'
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          # A failed earlier run may have created the tag already; reuse it.
          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            git tag "$tag"
            git push origin "$tag"
          fi

      - name: Build and publish
        if: steps.version.outputs.skip == 'false'
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
